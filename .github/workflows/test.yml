name: Tests on PR or Push into Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  BuildTask:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2.3.1
        with:
          products: Instrument_Control_Toolbox
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: matlab-actions/run-build@v2
        with:
          tasks: test
