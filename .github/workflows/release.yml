name: Release (toolbox, docs and installers)

on:
  push:
    tags:
      - "v*.*"   # i.e. Releases - manually tag releases with version names 'v3.6.0' to trigger this - also matches v1.2.3

jobs:
  Toolbox:
    environment: "Palladium Build Environment"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # DocMaker converts Markdown via the GitHub API; the job's own token is enough
      DOCMAKER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Virtual display, so DocMaker's docrun can capture figures. Only Linux
      # needs one - Windows and macOS runners already have a desktop session
      - name: Start a display server
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      - uses: matlab-actions/setup-matlab@v2.3.1
        with:
          products: Instrument_Control_Toolbox
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Tests already ran on the push/PR to main
      - uses: matlab-actions/run-build@v2
        with:
          tasks: packageToolbox -skip check -skip test
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox
          path: "Release/Toolbox/PalladiumDAQ.mltbx"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: "Palladium DAQ/Docs"
          if-no-files-found: error

  Installer:
    needs: Toolbox
    environment: "Palladium Build Environment"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{matrix.os}}
    permissions:
      contents: read
    env:
      # MATLAB Compiler token - adding MATLAB_Compiler will fail if this is not present or valid
      MLM_LICENSE_TOKEN: ${{secrets.MLM_LICENSE_TOKEN}}
    steps:
      - uses: actions/checkout@v4
      # The installer bundles the built docs, so reuse the Linux job's rather than rebuilding
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: "Palladium DAQ/Docs"
      - uses: matlab-actions/setup-matlab@v2.3.1
        with:
          products: |
            Instrument_Control_Toolbox
            MATLAB_Compiler
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: matlab-actions/run-build@v2
        with:
          tasks: deploy -skip check -skip test -skip packageToolbox -skip doc -skip apidoc -skip gettingStarted
      - uses: actions/upload-artifact@v4
        with:
          name: installer_${{matrix.os}}
          path: "Release/Package/Runtime Web Installer/Palladium DAQ Installer - Runtime Web Installer.*"
          retention-days: 5
          if-no-files-found: error

  Pages:
    needs: Toolbox
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  Release:
    needs: [Toolbox, Installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolbox
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: installer_*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs
      - name: Zip docs
        run: cd docs && zip -r ../dist/PalladiumDAQ-docs.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
